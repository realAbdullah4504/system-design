AWSTemplateFormatVersion: '2010-09-09'
Description: Job Processing System - MongoDB URI Secret (Environment-Safe)

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Environment name (dev, staging, prod)

  MongoURI:
    Type: String
    NoEcho: true
    Description: Full MongoDB connection URI (mongodb://user:pass@host:port/db)

  SqsQueueUrl:
    Type: String
    NoEcho: true
    Description: SQS Queue URL

  SqsQueueArn:
    Type: String
    NoEcho: true
    Description: SQS Queue ARN

  TopicArn:
    Type: String
    NoEcho: true
    Description: SNS Topic ARN

  RedisPassword:
    Type: String
    Default: vfGsq0AJ84EjYk4hGFpHYimF6LE6YUvG
    Description: Redis password
    NoEcho: true

Resources:

  MongoDBPrimarySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "job-system/${EnvironmentName}/database/mongodb-primary"
      Description: MongoDB connection URI for ${EnvironmentName}
      SecretString: !Sub "${MongoURI}"

  SqsQueueUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "job-system/${EnvironmentName}/messaging/sqs-queue-url"
      Description: SQS Queue URL for ${EnvironmentName}
      SecretString: !Sub "${SqsQueueUrl}"

  SqsQueueArnSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "job-system/${EnvironmentName}/messaging/sqs-queue-arn"
      Description: SQS Queue ARN for ${EnvironmentName}
      SecretString: !Sub "${SqsQueueArn}"

  TopicArnSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "job-system/${EnvironmentName}/messaging/topic-arn"
      Description: SNS Topic ARN for ${EnvironmentName}
      SecretString: !Sub "${TopicArn}"

  RedisPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "job-system/${EnvironmentName}/cache/redis-password"
      Description: Redis password for ${EnvironmentName}
      SecretString: !Sub "${RedisPassword}"

Outputs:
  MongoDBPrimarySecretArn:
    Description: ARN of MongoDB Primary Secret
    Value: !Ref MongoDBPrimarySecret
    Export:
      Name: !Sub "${EnvironmentName}-MongoDBPrimarySecretArn"

  SqsQueueUrlSecretArn:
    Description: ARN of SQS Queue URL Secret
    Value: !Ref SqsQueueUrlSecret
    Export:
      Name: !Sub "${EnvironmentName}-SqsQueueUrlSecretArn"

  SqsQueueArnSecretArn:
    Description: ARN of SQS Queue ARN Secret
    Value: !Ref SqsQueueArnSecret
    Export:
      Name: !Sub "${EnvironmentName}-SqsQueueArnSecretArn"

  TopicArnSecretArn:
    Description: ARN of SNS Topic ARN Secret
    Value: !Ref TopicArnSecret
    Export:
      Name: !Sub "${EnvironmentName}-TopicArnSecretArn"

  RedisPasswordSecretArn:
    Description: ARN of Redis Password Secret
    Value: !Ref RedisPasswordSecret
    Export:
      Name: !Sub "${EnvironmentName}-RedisPasswordSecretArn"