config:
  target: "http://54.81.15.199:3000"
  phases:
    - duration: 300
      arrivalRate: 1

scenarios:
  - name: "Send Events Load Test"
    flow:
      - post:
          url: "/api/events/send"
          json:
            type: "load_test_event"
            payload:
              userId: "user_{{ $randomString() }}"
              action: "test_action"
              timestamp: "{{ $timestamp() }}"
              testData: "Load test data {{ $randomInt(1, 1000) }}"