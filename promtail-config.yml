server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: backend-logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: api-service
      __path__: /var/log/backend/*.log
  pipeline_stages:
  - json:
      expressions:
        level: level
        message: message
        service: service
        timestamp: timestamp
  - labels:
      level: level
      service: service
  - timestamp:
      format: RFC3339
      source: timestamp

- job_name: workers-logs
  static_configs:
  - targets:
      - localhost
    labels:
      job: worker-services
      __path__: /var/log/workers/*.log
  pipeline_stages:
  - json:
      expressions:
        level: level
        message: message
        service: service
        timestamp: timestamp
  - labels:
      level: level
      service: service
  - timestamp:
      format: RFC3339
      source: timestamp
